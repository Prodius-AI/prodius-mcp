[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prodius-mcp"
version = "0.3.0"
description = "MCP server shim for Prodius — lets AI agents reach you by voice"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Prodius", email = "support@prodius.ai" }]
keywords = ["mcp", "model-context-protocol", "voice", "prodius", "ai-agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://prodius.ai"
Connect = "https://prodius.ai/connect/"

[project.scripts]
prodius-mcp = "prodius_mcp:main"
prodius-mcp-reset = "prodius_mcp.reset:main"
prodius-permission-hook = "prodius_mcp.permission_hook:main"

[tool.setuptools.packages.find]
where = ["src"]
